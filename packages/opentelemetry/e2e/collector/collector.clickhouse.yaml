receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: [http://runner:4173]
          allowed_headers: [Content-Type]
exporters:
  clickhouse:
    endpoint: http://clickhouse:8123
    database: otel
    username: default
    password: e2e
    create_schema: true
    async_insert: false
    timeout: 10s
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 1000
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
